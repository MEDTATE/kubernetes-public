# 단순 Pod 생성
apiVersion: v1
kind: Pod
metadata:
  name: netflixweb-pod
  labels:
    app: nginx-app
spec:
  containers:
  - name: nginx-app
    image: powermvp/netflix:v2.0
    ports:
    - containerPort: 80
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi